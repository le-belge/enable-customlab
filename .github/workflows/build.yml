name: Build test apps
# Unit tests (Ubuntu + Windows, Qt offscreen) on every push and pull request.
# Builds: manual run (Actions > Build test apps > Run workflow) or on a tag "v*", only once the tests pass. Produces unsigned test builds
# as downloadable artifacts; each built app is started with --selftest (no window, exit code 0/1) before upload.
# The user's SCAD/STL sources and OpenSCAD are NOT bundled (see packaging/LISEZ-MOI_BUILD.md).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install PySide6-Essentials numpy
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build:
    needs: tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install PySide6-Essentials numpy pyinstaller
      - name: Smoke test (imports, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import customlab.gui, customlab.placement, customlab.deco; print('imports ok')"
      - name: Build (macOS)
        if: matrix.name == 'mac'
        run: |
          python -m PyInstaller packaging/customlab.spec --noconfirm --distpath dist --workpath build
          codesign --force --deep --sign - "dist/e-NABLE CustomLab.app"
          cd dist && ditto -c -k --sequesterRsrc --keepParent "e-NABLE CustomLab.app" "e-NABLE_CustomLab_mac.zip"
      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: |
          python -m PyInstaller packaging/customlab.spec --noconfirm --distpath dist --workpath build
          Compress-Archive -Path dist/CustomLab -DestinationPath dist/e-NABLE_CustomLab_windows.zip -Force
      - name: Self-test of the built app (macOS)
        if: matrix.name == 'mac'
        run: |
          "dist/e-NABLE CustomLab.app/Contents/MacOS/CustomLab" --selftest --report selftest_mac.txt
      - name: Self-test of the built app (Windows)
        if: matrix.name == 'windows'
        # console=False: the .exe has no console, so wait for it explicitly and read the report file
        run: |
          $p = Start-Process -FilePath "dist\CustomLab\CustomLab.exe" -ArgumentList "--selftest", "--report", "selftest_windows.txt" -Wait -PassThru -NoNewWindow
          if (Test-Path selftest_windows.txt) { Get-Content selftest_windows.txt -Encoding utf8 } else { Write-Output "no report written" }
          # fail-safe: a null ExitCode or a missing/incomplete report must not pass as success
          $ok = (Test-Path selftest_windows.txt) -and (Select-String -Path selftest_windows.txt -Pattern '^selftest OK$' -Quiet)
          if ($p.ExitCode -ne 0 -or -not $ok) { Write-Output "selftest failed (exit code: $($p.ExitCode))"; exit 1 }
      - name: Installer (Windows, Inno Setup)
        if: matrix.name == 'windows'
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: e-NABLE_CustomLab_${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*Setup.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "e-NABLE CustomLab V1 - bêta test ($GITHUB_REF_NAME)" \
            --notes "Version bêta de test, EXPÉRIMENTALE : non signée, non testée sur poste vierge, aucune validation médicale ni d'impression (à faire contrôler par un bénévole e-NABLE compétent). Windows : lancer e-NABLE_CustomLab_Setup.exe (installer OpenSCAD à part). macOS : e-NABLE_CustomLab_mac.zip. Voir le README. Code sous GPL-3.0 ; pièces jesimon (CC BY-NC) et logo e-NABLE France : licences propres."
