<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- tête : rectangle arrondi (courbes) avec deux yeux en trous (evenodd) et une grille de bouche -->
  <path fill-rule="evenodd" fill="#222" d="M40 60 Q40 40 60 40 L140 40 Q160 40 160 60 L160 130 Q160 150 140 150 L60 150 Q40 150 40 130 Z
     M62 75 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 Z M110 75 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 Z"/>
  <!-- pupilles : îlots dans les trous -->
  <circle cx="76" cy="75" r="6" fill="#222"/><circle cx="124" cy="75" r="6" fill="#222"/>
  <!-- grille de bouche : fentes fines -->
  <rect x="62" y="112" width="76" height="3" fill="#fff"/><rect x="62" y="122" width="76" height="3" fill="#fff"/><rect x="62" y="132" width="76" height="3" fill="#fff"/>
  <!-- antenne + boule -->
  <rect x="97" y="18" width="6" height="22" fill="#222"/><circle cx="100" cy="14" r="8" fill="#222"/>
  <!-- oreilles : deux engrenages à 10 dents -->
  <polygon fill="#222" points="22,95 28,92 31,84 38,86 40,95 46,100 40,105 38,114 31,116 28,108 22,105 16,108 13,116 6,114 4,105 -2,100 4,95 6,86 13,84 16,92"/>
  <polygon fill="#222" points="178,95 184,92 187,84 194,86 196,95 202,100 196,105 194,114 187,116 184,108 178,105 172,108 169,116 162,114 160,105 154,100 160,95 162,86 169,84 172,92"/>
  <!-- sourire courbe (trait, Bézier cubique) -->
  <path d="M70 168 C 85 190, 115 190, 130 168" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- éclair isolé -->
  <polygon fill="#222" points="100,155 88,176 98,176 92,196 112,170 101,170"/>
</svg>
